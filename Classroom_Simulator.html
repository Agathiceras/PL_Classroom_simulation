<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b3144; --head:#363d55; --tile:#393f5a; --tile-b:#424a66; --box:#2e3448;
  --lime:#cdf24a; --blue:#5b8cff; --lbl:#1d2131; --red:#ff4d5e; --txt:#e8eaf1; --muted:#a3a9bd;
  --btn:#3c4360; --btn-on:#4b5377; --kl:#2a2e3d; --kl-head:#383d55;
  --coach:#ffd34d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* ---------- Classroom header ---------- */
.cr-head{height:56px;background:var(--head);display:flex;align-items:center;padding:0 18px;gap:12px;position:relative}
.cr-head .back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.cr-head .back:hover{background:#4a5274}
.cr-head b{font-size:15px;font-weight:700}
.cr-head .muted{color:var(--muted);font-size:13px}
.hdr-btn{margin-left:auto;background:#262b3c;border:1px solid #545d80;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.hdr-btn:hover{background:#3a4160}
.hdr-btn+.leave{margin-left:18px}
.leave{margin-left:auto;color:var(--red);font-size:13px;display:flex;align-items:center;gap:6px}
.hud{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.hud-chip{background:#262b3c;border:1px solid #545d80;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.hud-chip.mode{background:var(--coach);color:#2a2410;border-color:var(--coach)}
.heart{font-size:14px;transition:.3s}
.heart.lost{filter:grayscale(1);opacity:.35}
.heart.breaking{animation:heartBreak .8s ease}
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.6)}60%{transform:scale(.6) rotate(-20deg)}100%{transform:scale(1)}}
.dia-pop{animation:diaPop .9s ease}
@keyframes diaPop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---------- Console ---------- */
.console{height:calc(100vh - 56px);padding:16px 14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.room-box{border:1px solid var(--tile-b);border-radius:14px;padding:4px;background:var(--box);position:relative;min-height:0}
.room-box.joined{cursor:pointer}
.room-box.joined:hover{border-color:#6d7799}
.room-inner{height:100%;border-radius:11px;background:var(--tile);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.room-box.joined .room-inner{background:var(--box);align-items:flex-start;justify-content:flex-start}
.tag{position:absolute;top:8px;left:8px;background:var(--lbl);font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;z-index:2;display:flex;align-items:center;gap:6px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}
.av{width:60px;height:60px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:22px;color:#24305a;font-weight:500}
.lbl{position:absolute;left:8px;bottom:8px;background:var(--lbl);font-size:12px;padding:5px 10px;border-radius:5px;display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:2}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.bars i{width:2.5px;background:#3fd16b;border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}
.minis{display:flex;gap:4px;padding:0}
.mini{position:relative;border-radius:9px;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mini img{width:100%;height:100%;object-fit:cover}
.console .mini{width:242px;height:148px}
.console .mini .av{width:60px;height:60px}
.console .minis{padding:0}
.side .mini{width:78px;height:64px}
.side .mini .av{width:30px;height:30px;font-size:13px}
.side .mini .lbl{font-size:10px;padding:2px 5px;left:3px;bottom:3px;max-width:70px;overflow:hidden}
.side .room-box.joined .room-inner{padding:2px}
.side .room-box.joined .tag{top:6px;left:6px}

/* ---------- Room layout ---------- */
.room-layout{height:calc(100vh - 56px);display:flex;gap:14px;padding:16px 14px}
.side{width:262px;flex:0 0 262px;display:flex;flex-direction:column;gap:14px}
.side .room-box{flex:1}
.side .av{width:60px;height:60px}
.frame{flex:1;min-width:0;border:2px solid var(--lime);border-radius:14px;padding:6px;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.frame-tag{top:12px;left:12px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.vt{position:relative;background:var(--tile);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;transition:box-shadow .2s}
.vt.student img{height:100%;width:auto;max-width:100%;object-fit:cover;aspect-ratio:16/9}
.vt .dots{position:absolute;top:8px;right:8px;width:28px;height:26px;border-radius:6px;background:var(--lbl);font-size:14px;line-height:1}
.vt.speaking{box-shadow:inset 0 0 0 3px #3fd16b}
.follow-badge{position:absolute;top:8px;left:8px;background:#fff;color:#1d2131;font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;display:flex;gap:5px;align-items:center;z-index:3;animation:fadeIn .4s}
.stage.tasks{flex-direction:row;gap:14px}
.kl{flex:1;min-width:0;background:var(--kl);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.kl-head{height:64px;background:var(--kl-head);display:flex;align-items:center;padding:16px 16px 0;flex:0 0 auto}
.kl-logo{font-family:Unbounded,Inter,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em}
.kl-right{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:14px}
.theme{display:flex;align-items:center;gap:6px;color:#7f87a8}
.theme .sw{width:58px;height:30px;border-radius:999px;background:#2a2f40;position:relative}
.theme .sw::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#7c84b0;top:3px;left:31px}
.lang{border:1px solid #9aa0b5;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600}
.kl-user{display:flex;align-items:center;gap:10px}
.kl-av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#c9d4ff,#6c79c9);border:2px solid #fff}
.kl-body{flex:1;min-height:0;display:flex}
.kl-rail{width:40px;flex:0 0 40px;border-right:1px solid #3d4258;padding-top:10px;display:flex;justify-content:center}
.atom{width:28px;height:28px;border-radius:6px;background:var(--blue);display:grid;place-items:center}
.kl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.kl-title{padding:16px 24px 12px;font-size:15px;font-weight:600}
.task-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 24px;scroll-behavior:smooth}
.task-scroll::-webkit-scrollbar{width:12px}
.task-scroll::-webkit-scrollbar-track{background:#fff;border-radius:2px}
.task-scroll::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:6px;border:3px solid #fff}
.right-col{width:228px;flex:0 0 228px;border:1px solid #3d4460;border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px}
.right-col .vt{flex:0 0 124px}
.right-col .vt .av{width:58px;height:58px}
.right-col .vt.student img{width:100%;height:100%}
.right-col .lbl{font-size:12px}

/* ---------- Toolbar ---------- */
.tb{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:8px 6px 2px;position:relative}
.tb-l,.tb-c{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-btn{white-space:nowrap}
.tb-c{margin:0 auto}
.tb-btn,.tb-ico,.ib,.lead,.nav button{height:40px;border-radius:10px;background:var(--btn);display:flex;align-items:center;gap:8px;font-size:13px;position:relative;transition:background .15s}
.tb-btn{padding:0 14px}
.tb-btn.on{background:var(--btn-on);box-shadow:inset 0 0 0 1px #8a93b8}
.tb-group{display:flex;border-radius:10px;background:var(--btn)}
.tb-group .tb-btn,.tb-group .tb-ico{background:transparent}
.tb-ico{width:42px;justify-content:center}
.tb-group:hover .tb-btn{background:var(--blue);border-radius:10px 0 0 10px}
.tb-group.on{background:var(--btn-on)}
.tb-ico:hover{background:#525b82 !important}
.nav{display:flex;border-radius:10px;background:var(--btn-on);overflow:hidden}
.nav button{width:46px;justify-content:center;background:transparent;border-radius:0}
.nav button:hover{background:#5d6790}
.lead{padding:0 12px 0 14px;cursor:pointer;user-select:none;white-space:nowrap}
.lead .sw{width:34px;height:20px;border-radius:999px;border:2px solid #fff;position:relative;transition:.25s;background:transparent}
.lead .sw::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.25s}
.lead.on .sw{background:var(--blue);border-color:var(--blue)}
.lead.on .sw::after{left:16px}
.lead.flash{animation:leadFlash 1s ease}
@keyframes leadFlash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 4px rgba(91,140,255,.6)}}
.ib{width:40px;justify-content:center}
.ib:hover{background:#4a5274}
.pair{display:flex;border-radius:10px;background:var(--btn)}
.pair .ib{background:transparent}
.pair .ib+.ib{width:36px;border-left:1px solid #2f3550;border-radius:0 10px 10px 0}
.ib.cnt{width:auto;padding:0 14px;gap:12px}
.end{margin-left:auto;height:40px;border-radius:10px;background:var(--btn);color:var(--red);padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;color:#222;font-size:12px;padding:4px 8px;white-space:nowrap;z-index:50;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* ---------- Activity dropdown ---------- */
.dd{position:absolute;left:104px;bottom:62px;width:450px;height:400px;background:#363d55;border:1px solid #9aa0b5;border-radius:8px;z-index:20;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dd-scroll{height:100%;overflow-y:auto;padding:4px}
.dd-item{padding:11px 16px;font-size:14px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dd-item:hover{background:#454d6c}
.dd-item.sel{background:#5a6286}

/* ---------- Activity content (kodland dark) ---------- */
.task{max-width:720px;margin:0 auto;padding:6px 0 60px;font-size:15px;line-height:1.65;color:#e4e6ee}
.task h1{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:33px;line-height:1.2;margin:22px 0 16px}
.task h2{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:23px;margin:26px 0 10px}
.task h3{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:19px;margin:20px 0 8px}
.task p{margin:8px 0}
.task ul,.task ol{padding-left:22px;margin:6px 0}
.task li{margin:6px 0}
.task blockquote{border-left:3px solid #8b90a4;margin:16px 0;padding:2px 0 2px 16px;color:#a9aec1}
.banner{width:100%;display:block;border-radius:14px;margin:14px 0}
.media{display:flex;gap:22px;align-items:flex-start;margin:16px 0}
.media-img{flex:0 0 44%;background:#fde9e6;padding:10px;border-radius:16px}
.media.narrow .media-img{flex-basis:25%}
.media-img img{width:100%;display:block;border-radius:10px}
.media-c{flex:1;min-width:0}
.media-c h3{margin-top:4px}
.spoiler{border:1px solid #c5c8d3;border-radius:12px;margin:10px 0;overflow:hidden}
.spoiler summary{list-style:none;padding:12px 16px;font-weight:600;cursor:pointer;display:flex;gap:12px;align-items:center}
.spoiler summary::-webkit-details-marker{display:none}
.spoiler summary::before{content:"▸";font-size:10px;color:#a9aec1;transition:.2s}
.spoiler[open] summary::before{transform:rotate(90deg)}
.spoiler[open] summary{border-bottom:1px solid #c5c8d3}
.sp-body{padding:6px 20px 10px}
.note{background:#353c54;border-left:3px solid var(--blue);border-radius:12px;padding:14px 22px;margin:16px 0}
.note-t{color:#6f97ff;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tnotes{border:1px dashed #a97a26;background:#32333e;border-radius:12px;padding:16px 18px 10px;margin:22px 0}
.tn-label{color:#c98b1e;font-size:13px;margin-bottom:4px}
.tnotes h1{font-size:30px}
.tnotes video{width:100%;border-radius:10px;margin:10px 0;background:#000}
.quiz label{display:flex;gap:12px;align-items:center;border:1px solid #c5c8d3;border-radius:10px;padding:11px 16px;margin:8px 0;cursor:pointer}
.quiz input{width:18px;height:18px;accent-color:#ec5fa6}
.submit{display:block;margin:12px auto;background:#ec5fa6;color:#fff;border:3px solid #fff;border-radius:10px;padding:8px 16px;font-weight:600}
.sim-note{color:#a9aec1;font-style:italic;border:1px dashed #5c6380;border-radius:10px;padding:12px 16px}
.center-img{display:block;max-width:470px;width:100%;margin:12px auto;border-radius:14px}

/* ---------- Simulator layers (guide, decisions, modals) ---------- */
#spot{position:fixed;border-radius:12px;pointer-events:none;z-index:900;box-shadow:0 0 0 9999px rgba(10,12,22,.55);display:none}
#spot::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:3px solid var(--coach);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,211,77,.7)}70%{box-shadow:0 0 0 12px rgba(255,211,77,0)}100%{box-shadow:0 0 0 0 rgba(255,211,77,0)}}
#coach{position:fixed;z-index:950;width:350px;background:#fff;color:#1f2433;border-radius:16px;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:none;transition:left .3s,top .3s;border-top:6px solid var(--coach)}
#coach .c-step{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a07a00}
#coach h4{margin:6px 0 8px;font-size:17px}
#coach p{margin:0;font-size:14px;line-height:1.55;color:#3a4052}
#coach .c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
#coach .c-hint{font-size:12px;color:#8a7020;font-weight:600}
#coach.shake{animation:shake .4s}
#coach .c-text{font-size:14px;line-height:1.55;color:#3a4052}
#coach.side{width:264px;max-height:calc(100vh - 80px);overflow-y:auto;transition:none}
#coach.side .c-text{font-size:13.5px}
#coach.wide{width:600px}
#coach .btn-p:disabled{background:#c9cdd8;cursor:not-allowed}
.c-check{list-style:none;padding:10px 12px;margin:12px 0 0;background:#f4f6fa;border-radius:10px;font-size:13px}
.c-check li{padding:3px 0 3px 24px;position:relative;color:#5a6075}
.c-check li::before{content:"○";position:absolute;left:4px;color:#a0a6b8;font-weight:700}
.c-check li.ok{color:#1f7a45}
.c-check li.ok::before{content:"✓";color:#1f9d55}
.c-list{margin:12px 0 0;padding-left:20px}
.c-list li{margin:6px 0}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.view{background:#f4f6fa;border-radius:12px;padding:10px}
.vh{font-size:13px;margin-bottom:8px}
.mock{background:#2a2e3d;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;height:118px}
.m-tn{border:1.5px dashed #c98b1e;color:#e8b35a;border-radius:6px;padding:6px 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.m-tn small{font-weight:500;color:#c9a35f}
.mk-c{flex:1;border-radius:6px;background:#3a4160;color:#cfd3e2;font-size:12px;display:grid;place-items:center}
.lead-demo{margin:12px 0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.lead-demo>div{background:#f4f6fa;border-radius:10px;padding:8px 10px 8px 52px;position:relative;line-height:1.45}
.ld-sw{position:absolute;left:10px;top:10px;width:32px;height:18px;border-radius:999px;border:2px solid #8a90a6}
.ld-sw::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#8a90a6;top:2px;left:2px}
.ld-sw.on{background:var(--blue);border-color:var(--blue)}
.ld-sw.on::after{background:#fff;left:16px}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.btn-p{background:#1f2433;color:#fff;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px}
.btn-p:hover{background:#3a4260}
.btn-y{background:var(--coach);color:#2a2410;border-radius:12px;padding:13px 26px;font-weight:700;font-size:15px}
.btn-y:hover{filter:brightness(1.05)}

#qp{position:fixed;z-index:800;right:12px;top:66px;width:430px;max-height:calc(100vh - 150px);overflow-y:auto;background:#fff;color:#1f2433;border-radius:18px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;border-top:6px solid var(--coach);animation:fadeIn .35s}
#qp.busy{opacity:.6;pointer-events:none}
#qp.mini .qp-body{display:none}
#qp.mini{width:300px}
.qp-head{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a07a00}
.qp-head span+span{margin-left:auto}
.qp-min{width:26px;height:26px;border-radius:7px;background:#f1f3f8;color:#3a4260;font-size:18px;line-height:1;font-weight:700}
.qp-min:hover{background:#e3e7f0}
.qp-body .btn-y{margin-top:4px}
.qp-lock{background:#fff4c7;color:#6b5000;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 6px}
.qp-opt.locked{opacity:.45;cursor:not-allowed}
.qp-replay{margin-top:8px;font-size:13px;font-weight:600;color:#3a4260;border:1px solid #d5d9e5;border-radius:8px;padding:7px 12px}
.qp-replay:hover{background:#f1f3f8}
.qp-open .console{padding-right:456px}
.qp-room #qp{right:256px;width:400px}
.qp-room .notes-tab{right:656px}

/* raised hands, chat notifications, screen share, notes */
.room-box.hand{border-color:#f5a623}
.hand-ico{font-size:13px;margin-left:2px}
.chat-pop{position:absolute;left:8px;bottom:10px;width:min(250px,calc(100% - 16px));background:#3a4160;border-radius:10px;padding:10px 12px;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:fadeIn .3s;cursor:default}
.cp-head{display:flex;gap:10px;align-items:center}
.cp-av{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.cp-head b{display:block;font-size:13px}
.cp-head small{font-size:11px;color:#a3a9bd}
.cp-x{margin-left:auto;font-size:20px;line-height:1;color:#c8cde0}
.chat-pop p{margin:8px 0 0;font-size:14px}
.share{flex:1;min-width:0;background:#000;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.share video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;background:#000}
.share-close{position:absolute;top:44px;left:12px;background:#2f3447;color:#e8eaf1;font-size:12px;border-radius:6px;padding:6px 10px;z-index:2}
.share-wait{color:#a3a9bd;font-size:15px}
.notes-tab{position:fixed;right:446px;top:42%;z-index:870;background:var(--coach);color:#2a2410;font-weight:700;font-size:14px;border-radius:12px 0 0 12px;padding:16px 10px;writing-mode:vertical-rl;transform:rotate(180deg);box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tabPulse 1.6s infinite}
.notes-tab.seen{animation:none}
@keyframes tabPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,211,77,.7)}50%{box-shadow:0 0 0 10px rgba(255,211,77,0)}}
.notes-card{width:auto;max-width:92vw;padding:20px 22px 18px;background:#fbf6ee}
.notes-card img{display:block;max-height:68vh;max-width:100%;margin:0 auto;border-radius:6px}
.rate{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.rate span{border:1px solid #c5c8d3;border-radius:10px;padding:9px 14px}

  const key = S.view === 'room' ? `${S.room}-${curRoom().activity}-${curRoom().mode}` : 'console';
  const notesTab = S.notesTab && S.phase === 'game' ? `<button class="notes-tab ${S.notesSeen ? 'seen' : ''}" data-action="openNotes">📝 My notes</button>` : '';
  $('#app').innerHTML = header() + (S.view === 'console' ? consoleView() : roomView()) + notesTab;
  const sc2 = $('#taskScroll');
  if (sc2){

    sc2.style.scrollBehavior = 'auto';

    else if (key === lastKey) sc2.scrollTop = prevTop;
    sc2.style.scrollBehavior = '';
  }
  const dd2 = $('#ddScroll'); if (dd2) dd2.scrollTop = prevDD;
  const ph = $('#shareVid');
  if (oldVid && ph && ph.dataset.src === oldVid.dataset.src){
    ph.replaceWith(oldVid);
    if (vidWasPlaying) oldVid.play().catch(() => {});
  }
  lastKey = key;
  document.body.classList.toggle('qp-room', S.view === 'room');
  requestAnimationFrame(placeOverlays);

/* =========================================================
   CLASSROOM ACTIONS (real behaviour of the platform)
   ========================================================= */
function perform(action, arg){
  const r = S.room !== null ? curRoom() : null;
  switch(action){
    case 'enterRoom':
      if (!S.rooms[arg].joined) return false;
      S.view = 'room'; S.room = +arg; S.dropdown = false; break;
    case 'back': S.view = 'console'; S.dropdown = false; break;
    case 'classroom': r.mode = 'classroom'; S.dropdown = false; break;
    case 'openTasks':
      if (r.activity === null) S.dropdown = !S.dropdown;
      else { r.mode = 'tasks'; S.dropdown = false; }
      break;
    case 'toggleDropdown': S.dropdown = !S.dropdown; break;
    case 'pickActivity': r.activity = +arg; r.mode = 'tasks'; S.dropdown = false; break;
    case 'toggleLead': r.lead = !r.lead; break;
    case 'nextTask': if (r.activity < ACTIVITIES.length - 1) r.activity++; break;
    case 'prevTask': if (r.activity > 0) r.activity--; break;
    default: return false;
  }
  render();
  return true;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !$('#app').contains(el)) return;
  const action = el.dataset.action, arg = el.dataset.arg;
  const key = arg !== undefined ? `${action}:${arg}` : action;

  // Always available: dismissing a chat notification and opening the tutor's notes
  if (action === 'closeMsg'){ e.stopPropagation(); delete S.msgs[arg]; render(); return; }
  if (action === 'openNotes'){ openNotes(); return; }
  if (action === 'openStructure'){ openStructure(); return; }

  if (S.phase === 'guide'){
    const step = GUIDE[S.step];
    if (step.accept && step.accept.includes(key)){ perform(action, arg); nextGuide(); }
    else nudge();
    return;
  }
  if (S.phase === 'game'){
    gameClick(action, arg, key);
    return;
  }
});

function startGuide(){
  $('#intro').style.display = 'none';
  S.phase = 'guide'; S.step = 0;
  enterStep();
}
function enterStep(){
  const st = GUIDE[S.step];
  S.readEnd = false;
  if (st.clock !== undefined) S.clock = st.clock;
  if (st.enter) st.enter();
  if (st.scrollTo && S.room !== null) curRoom().scrollTo = st.scrollTo;
  render();
  if (st.scrollTo){ const el = document.getElementById(st.scrollTo), sc = $('#taskScroll'); if (el && sc){ sc.style.scrollBehavior='auto'; sc.scrollTop = el.offsetTop - 20; sc.style.scrollBehavior=''; } }
}
function nextGuide(){
  const st = GUIDE[S.step];
  if (st.last){ finishGuide(); return; }
  S.step++;
  enterStep();
}
// Mandatory reading: has the player opened every section and reached the end of the content?
function readProgress(cfg){
  const sc = $('#taskScroll');
  if (!sc) return { done:true, total:0, opened:0, end:true };
  const scope = cfg.scope ? document.querySelector(cfg.scope) : sc;
  // Opening sections is required only where a scope is given (the Teacher notes); elsewhere, scrolling to the end is enough
  const sections = scope && (cfg.scope || cfg.sections) ? [...scope.querySelectorAll('details')] : [];
  const opened = sections.filter(d => d.dataset.seen).length;
  if (!S.readEnd && scope){
    const reached = cfg.scope
      ? scope.getBoundingClientRect().bottom <= sc.getBoundingClientRect().bottom + 8
      : sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 16;
    if (reached) S.readEnd = true;   // once reached, scrolling back up doesn't undo it
  }
  return { total:sections.length, opened, end:S.readEnd, done:S.readEnd && opened === sections.length };
}
document.addEventListener('toggle', e => {
  if (e.target.tagName === 'DETAILS' && e.target.open){ e.target.dataset.seen = '1'; if (S.phase === 'guide') renderCoach(); }
}, true);

function nudge(){
  const c = $('#coach');
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}

function renderCoach(){
  const coach = $('#coach'), spot = $('#spot');
  if (S.phase !== 'guide'){
    coach.style.display = 'none';
    const h = S.phase === 'game' && S.await && S.await.showHint && S.await.hint ? document.querySelector(S.await.hint) : null;
    if (h){ const r = h.getBoundingClientRect(), pad = 6; Object.assign(spot.style, { display:'block', left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px' }); }
    else spot.style.display = 'none';
    return;
  }
  const st = GUIDE[S.step];
  const rd = st.read ? readProgress(st.read) : null;
  let foot;
  if (rd){
    const items = [];
    if (rd.total) items.push(`<li class="${rd.opened === rd.total ? 'ok' : ''}">Open every section (${rd.opened}/${rd.total})</li>`);
    items.push(`<li class="${rd.end ? 'ok' : ''}">Scroll to the end${st.read.scope ? ' of the notes' : ' of the card'}</li>`);
    foot = `<ul class="c-check">${items.join('')}</ul><div class="c-foot"><span></span><button class="btn-p" id="coachNext" ${rd.done ? '' : 'disabled'}>Next →</button></div>`;
  } else if (st.next){
    foot = '<div class="c-foot"><span></span><button class="btn-p" id="coachNext">Next →</button></div>';
  } else {
    foot = '<div class="c-foot"><span class="c-hint">👆 Click the highlighted element</span><span></span></div>';
  }
  coach.className = (st.side ? 'side ' : '') + (st.wide ? 'wide' : '');
  coach.innerHTML = `<div class="c-step">Guided tour · ${S.step + 1}/${GUIDE.length}</div><h4>${st.title}</h4><div class="c-text">${st.text}</div>${foot}`;
  coach.style.display = 'block';
  const btn = $('#coachNext'); if (btn) btn.onclick = () => { if (!btn.disabled) nextGuide(); };
  if (st.side){
    // Docked over the sidebar so the card being read stays fully visible
    const t = st.target ? document.querySelector(st.target) : null;
    if (t){ const r = t.getBoundingClientRect(), pad = 6; Object.assign(spot.style, { display:'block', left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px' }); }
    coach.style.left = '12px'; coach.style.top = '66px';
    return;
  }

  const t = st.target ? document.querySelector(st.target) : null;
  const vw = innerWidth, vh = innerHeight, m = 16, pad = 6;
  let r = null;
  if (t){
    r = t.getBoundingClientRect();
    // keep spotlight inside the scroll container when the target is inside it
    const sc = t.closest('.task-scroll');
    if (sc && sc !== t){
      const b = sc.getBoundingClientRect();
      r = { left:r.left, right:r.right, top:Math.max(r.top,b.top), bottom:Math.min(r.bottom,b.bottom), width:r.width };
      r.height = Math.max(0, r.bottom - r.top);
    }
    Object.assign(spot.style, { display:'block', left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px' });
  } else spot.style.display = 'none';

  const cw = coach.offsetWidth, ch = coach.offsetHeight;
  let x, y;
  const fits = (x,y) => x >= 8 && y >= 64 && x + cw <= vw - 8 && y + ch <= vh - 8;
  const clampX = x => Math.min(Math.max(8, x), vw - cw - 8);
  const clampY = y => Math.min(Math.max(64, y), vh - ch - 8);
  if (!r){ x = (vw - cw) / 2; y = (vh - ch) / 2; }
  else {
    const cands = [
      [r.right + m + pad, clampY(r.top + r.height/2 - ch/2)],
      [r.left - m - pad - cw, clampY(r.top + r.height/2 - ch/2)],
      [clampX(r.left + r.width/2 - cw/2), r.top - m - pad - ch],
      [clampX(r.left + r.width/2 - cw/2), r.bottom + m + pad]
    ];
    const ok = cands.find(c => fits(c[0], c[1]));
    if (ok){ [x, y] = ok; } else { x = vw - cw - 20; y = 76; }
  }
  coach.style.left = x + 'px'; coach.style.top = y + 'px';
}

/* ---------- "Do it in Classroom" tasks: the player must click the real control ---------- */
function awaitClick(cfg){
  S.await = Object.assign({ misses:0, showHint:false, free:[] }, cfg);
  showTask(cfg.text, cfg.back);
}
function showTask(html, back){
  const t = $('#task');
  t.innerHTML = `<span class="t-ico">👆</span><span><b>Your move:</b> ${html}</span>${back ? '<button class="t-back" id="tBack">← Back to options</button>' : ''}`;
  t.style.display = 'flex';
  const b = $('#tBack'); if (b) b.onclick = () => { S.await = null; hideTask(); placeOverlays(); showQuestion(); };
}
function hideTask(){ $('#task').style.display = 'none'; }

/* =========================================================
   DECISION GAME
   Each scene: setup() puts Classroom in the right state, an optional intro
   plays first (audio / screen share), then the options are shown.
   Option kinds:  say  = the tutor says a line (optionally the student answers with audio)
                  pick = a decision, no line
                  do   = the tutor must click the real control (action / hint / prompt / miss)
   ========================================================= */

  S.rooms.forEach(r => { r.hand = false; });

function at(min){ S.clock = min; }

function atConsole(){ S.view = 'console'; S.room = null; S.dropdown = false; }
function leave(i){ S.rooms[i].joined = false; S.rooms[i].hand = false; }

let qIndex = 0;
const LIFE_COST = 3;   // diamonds needed to buy a life when the player runs out

/* ---------- Media helpers ---------- */
function setSpeaking(i){
  S.speaking = i;
  document.querySelectorAll('.vt.student').forEach(el => el.classList.toggle('speaking', i !== null && el.dataset.room === String(i)));
}
// A student talks: speaking ring + caption (with transcript if given) while the audio plays
function speak(i, file, transcript, done){
  setSpeaking(i);
  caption(`<span class="eq"><i></i><i></i><i></i><i></i></span><span><span class="who">${S.rooms[i].name}</span>${transcript ? ': “' + transcript + '”' : ' is speaking…'}</span>`);
  playAudio(AUDIO + file, () => { setSpeaking(null); caption(null); done(); });
}
// Builds a shared-screen <video>: no controls and no pointer events, so it reads as a live screen share
function makeShareVideo(src){
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.disablePictureInPicture = true;
  v.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
  v.oncontextmenu = () => false;
  v.src = src; v.dataset.src = src;
  return v;
}
// Videos loaded in the background ahead of time, so they start instantly when swapped in
const preloaded = {};
function preloadAsset(key){ const src = P[key]; if (!preloaded[src]){ const v = makeShareVideo(src); v.load(); preloaded[src] = v; } }

// Plays the shared-screen video once from the start; when it ends it stays on its last frame
function playShare(src, onStart, onEnd){
  let v = $('#shareVid');
  if (!v){ onStart && onStart(); onEnd && onEnd(); return; }
  S.share.src = src;
  if (v.dataset.src !== src){
    const nv = preloaded[src] || makeShareVideo(src);
    delete preloaded[src];
    nv.id = 'shareVid';
    v.replaceWith(nv);
    v = nv;
  }
  v.loop = false;
  let started = false, ended = false, guard = null;
  const end = () => {
    if (ended) return; ended = true; clearTimeout(guard);
    // If the video stalled before its natural end, jump to its last frame
    if (!v.ended && v.duration){ v.pause(); try { v.currentTime = Math.max(0, v.duration - 0.05); } catch(e){} }
    start(); onEnd && onEnd();
  };
  const start = () => {
    if (started) return; started = true;
    // Safety net: carry on even if the 'ended' event never arrives (e.g. a stalled video)
    guard = setTimeout(end, v.duration ? (v.duration - v.currentTime) * 1000 + 2000 : 20000);
    onStart && onStart();
  };
  v.onplaying = start;
  v.onended = end;
  v.onerror = () => setTimeout(end, 1500);
  setTimeout(start, 6000);   // still not playing after 6 s: don't leave the player waiting
  try { v.currentTime = 0; } catch(e){}
  v.play().catch(() => setTimeout(end, 1500));
}

/* ---------- Flow ---------- */
function runQuestion(){
  const Q = QUESTIONS[qIndex];
  S.tried = []; S.busy = false; S.await = null;
  S.introDone = !Q.intro;
  if (Q.present) S.rooms.forEach((r, k) => { r.joined = Q.present.includes(k); });
  if (Q.setup) Q.setup();
  render();
  (Q.preload || []).forEach(preloadAsset);
  // Options are shown in a random order, kept the same while the player retries this situation
  S.order = Q.options.map((_, k) => k).sort(() => Math.random() - 0.5);
  const go = () => { (Q.events || []).forEach(e => toast(e)); showQuestion(); };
  if (Q.recap) showRecap(Q.recap, go); else go();
}

function gameClick(action, arg, key){
  // Waiting for the player to click a real Classroom control
  if (S.await){
    const a = S.await;
    if (a.accept.includes(key)){
      S.await = null; hideTask();
      perform(action, arg);
      a.onDone();
      return;
    }
    if (a.free.includes(key)){ perform(action, arg); return; }
    a.misses++;
    if (a.misses >= 2){ a.showHint = true; toast('Here it is — look at the highlighted control', true); placeOverlays(); }
    else toast(a.miss, true);
    return;
  }
  // While a decision is open, clicking the control an option refers to counts as choosing it
  if (isQPOpen() && !S.busy && S.introDone){
    const Q = QUESTIONS[qIndex];
    const i = Q.options.findIndex((o, k) => o.action === key && !S.tried.includes(k));
    if (i >= 0){
      const o = Q.options[i];
      if (Q.requireNotes && !S.notesSeen){ toast('Check your notes first 📝', true); return; }
      if (o.kind === 'do'){ hideQP(); perform(action, arg); doneDo(o); }
      else choose(i);
      return;
    }
  }
  if (action === 'deco' || S.busy) return;
  if (isQPOpen()) toast('Make your decision in the panel', true);
}

function doneDo(o){
  S.busy = true;
  if (o.action === 'toggleLead') S.following = true;
  render();
  const lt = o.hint && $(o.hint); if (lt) lt.classList.add('flash');
  setTimeout(() => correct(o), 1300);
}

function showQuestion(){
  const Q = QUESTIONS[qIndex];
  S.busy = false;
  const qp = $('#qp');
  qp.className = '';
  const head = `<div class="qp-head"><span>Decision ${qIndex + 1} of ${QUESTIONS.length}</span><span>${Q.who}</span><button class="qp-min" id="qpMin" title="Hide / show">–</button></div>`;

  if (!S.introDone){
    qp.innerHTML = head + `<div class="qp-body"><p class="qp-q">${Q.intro.text}</p><button class="btn-y" id="introBtn">${Q.intro.btn}</button></div>`;
    showQP();
    $('#introBtn').onclick = () => {
      S.busy = true; qp.classList.add('busy', 'mini');
      Q.intro.run(() => { S.introDone = true; showQuestion(); });
    };
  } else {
    const locked = Q.requireNotes && !S.notesSeen;
    qp.innerHTML = head + `<div class="qp-body">
      <p class="qp-q">${Q.q}</p>
      ${locked ? '<p class="qp-lock">📝 Open <b>My notes</b> (the yellow tab) before you answer.</p>' : ''}
      ${(S.order || Q.options.map((_, k) => k)).map((i, pos) => { const o = Q.options[i]; return `<button class="qp-opt ${S.tried.includes(i) ? 'tried' : ''} ${locked ? 'locked' : ''}" data-opt="${i}"><span class="k">${'ABC'[pos]}</span><span>${o.label}</span></button>`; }).join('')}
      ${Q.intro && Q.intro.replay ? `<button class="qp-replay" id="replayBtn">🔁 ${Q.intro.replay}</button>` : ''}</div>`;
    showQP();
    qp.querySelectorAll('.qp-opt').forEach(b => b.onclick = () => choose(+b.dataset.opt));
    const rb = $('#replayBtn');
    if (rb) rb.onclick = () => { S.busy = true; qp.classList.add('busy', 'mini'); Q.intro.run(() => showQuestion()); };
  }
  $('#qpMin').onclick = () => qp.classList.toggle('mini');
}

function choose(i){
  if (S.busy) return;
  const Q = QUESTIONS[qIndex], o = Q.options[i];
  if (Q.requireNotes && !S.notesSeen){ toast('Check your notes first 📝', true); return; }

  if (o.kind === 'do'){
    // The tutor has to find and click the real control in Classroom
    hideQP();
    awaitClick({ text:o.prompt, accept:[o.action], hint:o.hint, miss:o.miss, back:true, onDone:() => doneDo(o) });
    return;
  }
  S.busy = true;
  $('#qp').classList.add('busy');
  const resolve = () => {
    if (!o.correct) return wrong(i, o);
    if (!o.post) return correct(o);
    $('#qp').classList.add('mini');   // keep the shared screen visible while the student acts
    o.post(() => correct(o));
  };
  if (o.kind === 'pick'){ setTimeout(resolve, 250); return; }

  // say: the tutor says the line first, then the student may answer (audio), then feedback
  // Recordings are named after the option's original letter (A/B/C as written in QUESTIONS), not its shuffled position
  tutorSay(o.say, o.voice || `Tutor_D${qIndex + 1}_${'ABC'[i]}.mp3`, () => {
    if (o.audio) speak(Q.room, o.audio, null, resolve);
    else resolve();
  }, !!o.voice);   // re-recordings that may not exist yet don't trigger the "audio not found" notice
}

// The tutor's recorded voice (Audios/Tutor_D<decision>_<letter>.mp3) with the line on screen.
// If the recording is missing, the line stays on screen for its reading time instead.
function tutorSay(text, file, done, quiet){
  const readMs = Math.min(9000, 1600 + text.length * 35);
  const tile = document.querySelector('.vt.teacher');
  if (tile) tile.classList.add('speaking');
  caption(`<span class="eq"><i></i><i></i><i></i><i></i></span><span><span class="who">You:</span> “${text}”</span>`);
  playAudio(AUDIO + file, () => {
    const t = document.querySelector('.vt.teacher'); if (t) t.classList.remove('speaking');
    caption(null);
    done();
  }, readMs, quiet);
}

// Shown once per file when a sound can't be loaded (e.g. the Audios folder isn't next to the simulator)
const audioWarned = {};
function audioMissing(src){
  const name = src.split('/').pop();
  if (audioWarned[name]) return; audioWarned[name] = true;
  toast(`🔇 Couldn’t play “${name}”. Check that the Audios folder is in the same folder as the simulator.`, true);
}

function playAudio(src, done, fallbackMs, quiet){
  const a = new Audio(src);
  let fin = false;
  const f = () => { if (fin) return; fin = true; done(); };
  const fb = fallbackMs || 1500;
  a.addEventListener('error', () => { if (!quiet) audioMissing(src); });
  a.onended = () => setTimeout(f, 400);
  // Safety net: continue after the clip's length even if 'ended' never fires
  a.onloadedmetadata = () => { if (isFinite(a.duration)) setTimeout(f, a.duration * 1000 + 1500); };
  a.onerror = () => setTimeout(f, fb);
  a.play().catch(() => setTimeout(f, Math.max(fb, 2500)));
  setTimeout(f, 60000);
}

function wrong(i, o){
  S.lives--;
  S.tried.push(i);
  render();
  const h = $('#heart-' + S.lives); if (h){ h.classList.add('breaking'); }
  hideQP();
  if (S.lives <= 0){
    // Out of lives: a life can be bought for LIFE_COST diamonds to keep playing from this situation
    const canBuy = S.diamonds >= LIFE_COST;
    modal(`<div class="m-card bad">
      <div class="m-icon">💔</div><h2>You’re out of lives</h2>
      <p>${o.why}</p>
      <div class="m-lives">🖤🖤🖤</div>
      <div class="shop ${canBuy ? '' : 'off'}">
        <p><b>Buy an extra life for 💎 ${LIFE_COST}</b> and continue from this situation.</p>
        <p class="shop-bal">You have 💎 ${S.diamonds}${canBuy ? '' : ` — you need ${LIFE_COST - S.diamonds} more`}</p>
      </div>
      <p>Otherwise, the game starts again from the first situation.</p>
      <div class="btns"><button class="btn-p" id="mRestart">Restart the game</button><button class="btn-y" id="mBuy" ${canBuy ? '' : 'disabled'}>❤️ Buy a life · 💎 ${LIFE_COST}</button></div>
      <p><button class="link-btn" id="mMenu">Back to menu</button></p></div>`);
    $('#mRestart').onclick = startGame;
    $('#mMenu').onclick = restart;
    if (canBuy) $('#mBuy').onclick = () => {
      S.diamonds -= LIFE_COST; S.lives = 1;
      render();
      const hh = $('#heart-0'); if (hh) hh.classList.add('dia-pop');
      closeModal(); showQuestion();
      toast(`❤️ Life bought — 💎 ${S.diamonds} left`, true);
    };
  } else {
    modal(`<div class="m-card bad">
      <div class="m-icon">❌</div><h2>Wrong choice — you lost a life</h2>
      <p>${o.why}</p>
      <div class="m-lives">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3 - S.lives)}</div>
      <p style="font-size:13px;color:#7a8094">${S.lives} ${S.lives === 1 ? 'life' : 'lives'} left</p>
      <div class="btns"><button class="btn-y" id="mRetry">Try again</button></div></div>`);
    $('#mRetry').onclick = () => { closeModal(); showQuestion(); };
  }
}

function correct(o){
  S.diamonds++;
  render();
  const d = $('#dia'); if (d) d.classList.add('dia-pop');
  hideQP();
  modal(`<div class="m-card good">
    <div class="m-icon">💎</div><h2>Correct! You earned a diamond</h2>
    <p>${o.why}</p>
    <div class="btns"><button class="btn-y" id="mCont">Continue</button></div></div>`);
  $('#mCont').onclick = () => {
    closeModal();
    qIndex++;
    if (qIndex < QUESTIONS.length) runQuestion();
    else finish();
  };
}

/* ---------- Parallel lesson structure (reference sheet) ---------- */
function structureHTML(){
  return `<div class="sheet-card">

    <h2>How a parallel lesson works</h2>
    <p class="sheet-sub">Each student has <b>60 minutes</b>. Students join <b>one by one, every 10 minutes</b> (17:00, 17:10, 17:20, 17:30), so each one is at a different point of their lesson.</p>
    <div class="phase-row">
      <div class="ph p1"><div class="ph-t"><span>1</span>Onboarding<small>about 10 min · live, 1:1</small></div>

function openStructure(){

/* ---------- Recap between situations ---------- */
function showRecap(rc, done){

    <div class="rc-kicker">${rc.kicker || 'Quick recap'}</div>

/* ---------- Tutor notes (scene 7) ---------- */
function openNotes(){
  modal(`<div class="m-card notes-card">
    <h2 style="margin:0 0 4px">📝 Your own notes</h2>
    <p style="margin:0 0 14px">You wrote these down during the lesson. Classroom doesn’t keep this record for you — get used to noting when each student started.</p>

}

function finish(){
  S.phase = 'done';
  render();
  const perfect = S.diamonds >= QUESTIONS.length && S.lives === 3;
  modal(`<div class="m-card info debrief">
    <div class="m-icon">🏁</div><h2>Simulation complete!</h2>
    <p style="text-align:center">You’ve made it through a full parallel lesson, from the first onboarding to the last goodbye.</p>
    <div class="m-lives">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3 - S.lives)} &nbsp; 💎 ${S.diamonds} / ${QUESTIONS.length}</div>

    <ol class="rc-steps">

    </ol>
    <div class="rc-now" style="animation-delay:.85s">${perfect
      ? '<b>Perfect lesson!</b> Play it again from time to time, and review the lesson structure before your first parallel lesson.'
      : '<b>Next step:</b> play it again until every decision feels obvious. Aim for 10/10 without losing a life.'}</div>
    <div class="btns"><button class="btn-p" id="mStruct">📋 Lesson structure</button><button class="btn-p" id="mMenu">Back to menu</button><button class="btn-y" id="mAgain">Play the game again</button></div></div>`);

  $('#mAgain').onclick = startGame;
  $('#mMenu').onclick = restart;
}

// Back to the start menu
function restart(){
  closeModal(); caption(null); hideTask(); hideQP();
  qIndex = 0;
  S = freshState();
  render();
  showIntro();
}

/* =========================================================
   OVERLAYS
   ========================================================= */
function placeOverlays(){ renderCoach(); }
// The decision panel is docked on the right; in the console view the rooms make room for it
function showQP(){ $('#qp').style.display = 'block'; document.body.classList.add('qp-open'); }
function hideQP(){ $('#qp').style.display = 'none'; document.body.classList.remove('qp-open'); }
const isQPOpen = () => $('#qp').style.display === 'block';
function modal(html){ const m = $('#modal'); m.innerHTML = html; m.style.display = 'flex'; }
function closeModal(){ const m = $('#modal'); m.style.display = 'none'; m.innerHTML = ''; }
function caption(html){ const c = $('#caption'); if (!html){ c.style.display = 'none'; return; } c.innerHTML = html; c.style.display = 'flex'; }
// Toasts queue up (e.g. "hand raised" then "student joined"); now=true replaces whatever is showing
let toastQ = [], toastT = null;
function toast(msg, now){
  if (now){ toastQ = []; clearTimeout(toastT); toastT = null; }
  toastQ.push(msg);
  if (!toastT) nextToast();
}
function nextToast(){
  const t = $('#toast'), m = toastQ.shift();
  if (!m){ t.style.display = 'none'; toastT = null; return; }
  t.textContent = m; t.style.display = 'block';
  toastT = setTimeout(nextToast, m.length > 60 ? 5000 : 2500);
}

window.addEventListener('resize', placeOverlays);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeOverlays);
document.addEventListener('scroll', () => { if (S.phase === 'guide' || S.await) renderCoach(); }, true);

// Plays a short chime (checks the speakers) and loads one of the simulator's sound files (checks the Audios folder)
function soundTest(){
  const msg = $('#soundMsg');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((hz, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + k * 0.18;
      o.frequency.value = hz; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.start(t); o.stop(t + 0.4);
    });
  } catch(e){}
  msg.textContent = 'Checking the sound files…';
  const a = new Audio(AUDIO + 'Alexander_reflection.mp3');
  a.preload = 'metadata';
  a.onloadedmetadata = () => { msg.innerHTML = '✅ You should have heard a short chime, and the sound files are ready. If you heard nothing, check your volume.'; };
  a.onerror = () => { msg.innerHTML = '⚠️ The sound files couldn’t be loaded. Make sure the <b>Audios</b> folder is in the same folder as this simulator.'; };
  a.load();
}

S = freshState();
render();
showWelcome();
