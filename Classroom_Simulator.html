<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/simulator.css">
</head>
<body>
<div id="app"></div>
<div id="spot"></div>
<div id="coach"></div>
<div id="qp"></div>
<div id="caption"></div>
<div id="task"></div>
<div id="toast"></div>
<div id="modal"></div>
<div id="intro"></div>
<div id="sheet"></div>

<!-- 1) Available languages -->
<script src="content/languages.js"></script>
<!-- 2) Texts of the chosen language: Classroom_Simulator.html?lang=it loads content/it.js and plays Audios/ITA (default: English) -->
<script>
  (function(){
    // Any content/<code>.js in the folder works with ?lang=<code>, even before it is listed in languages.js
    var q = ((location.search.match(/[?&]lang=([a-z-]+)/i) || [])[1] || 'en').toLowerCase();
    document.write('<script src="content/' + q + '.js"><\/script>');
  })();
</script>
<script>
  // File missing? Fall back to English
  if (!window.SIM_CONTENT) document.write('<script src="content/en.js"><\/script>');
</script>
<!-- 3) The engine (no texts inside) -->
<script src="assets/engine.js"></script>
</body>
</html>
